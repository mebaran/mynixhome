name: Update Home Manager

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1"  # Every Monday at 8:30 AM UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-home-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v17

      - name: Update local packages, skills, and Home Manager inputs
        run: make update-weekly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Nix files
        run: nix run nixpkgs#alejandra -- flake.nix packages/*.nix programs/pi.nix programs/skills.nix

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-home-manager
          commit-message: "Update Home Manager dependencies"
          title: "Update Home Manager dependencies"
          body: "Automated weekly update of local packages, Pi skill source pins, and Home Manager flake inputs."
          labels: dependencies

      - name: Merge PR immediately
        if: steps.create-pr.outputs.pull-request-number
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --squash --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
